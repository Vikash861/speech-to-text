services:
  - type: web
    name: speech-to-text
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev
    startCommand: npx prisma migrate deploy && node src/index.js
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: speech-to-text-db
          property: connectionString
      - key: GEMINI_API_KEY
        sync: false

databases:
  - name: speech-to-text-db
    plan: free
